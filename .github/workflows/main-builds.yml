# Publish main's packages as assets of the rolling `main-builds` pre-release,
# named <package>-<short sha>.tgz, for consumers that track main by URL. A run
# still waiting when a newer push arrives is cancelled, so a commit merged right
# after another may be skipped; the newest commit is always published. The
# knowledge base pins these assets, with bun.lock holding each tarball's sha512,
# so a published asset must never change: a commit whose facade asset exists is
# skipped (a failed lookup fails the run instead), and the facade uploads last,
# so its presence means the whole set is there. Then the knowledge base's Pin
# llmwiki workflow is dispatched with KB_DISPATCH_TOKEN, a fine-grained token
# whose only permission is Actions read/write on Octember/knowledge-base. The KB
# is told even about a commit already published, so re-running this workflow
# catches it up.
#
# The release must exist; recreate it with
# `gh release create main-builds --prerelease --title "Main builds"`.
# Only the newest KEEP commits' assets are kept. A consumer pinned to an older
# commit (more than KEEP merges behind main) can no longer install from scratch.
# The repository token reaches only the steps that call the release API, never
# the dependency installs and builds.
name: Main builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-builds
  cancel-in-progress: false

env:
  TAG: main-builds
  KEEP: 50
  GH_REPO: ${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  publish:
    # A run started by hand from another branch would publish that branch as a main build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip a commit already published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)
          names=$(gh api --paginate "repos/$GH_REPO/releases/$id/assets?per_page=100" --jq '.[].name')
          if grep -qx "llm-wiki-compiler-${GITHUB_SHA::7}.tgz" <<<"$names"; then
            echo "llm-wiki-compiler-${GITHUB_SHA::7}.tgz is already published"; echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.published.outputs.done != 'true'
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.published.outputs.done != 'true'
        with:
          bun-version-file: package.json
      - name: Build
        if: steps.published.outputs.done != 'true'
        run: bun install --frozen-lockfile && bun run build
      - name: Pack
        if: steps.published.outputs.done != 'true'
        run: |
          mkdir "$RUNNER_TEMP/packed"
          for spec in packages/llmwiki-core:atomicstrata-llmwiki-core \
                      packages/llmwiki-local-workflows:atomicstrata-llmwiki-local-workflows \
                      .:llm-wiki-compiler; do
            (cd "${spec%%:*}" && bun pm pack --ignore-scripts --quiet --filename "$RUNNER_TEMP/packed/${spec#*:}-${GITHUB_SHA::7}.tgz")
          done
          ls -l "$RUNNER_TEMP/packed"
      - name: Upload
        if: steps.published.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed run may have left these; nothing pins them until the facade exists.
          gh release upload "$TAG" --clobber "$RUNNER_TEMP"/packed/atomicstrata-*.tgz
          gh release upload "$TAG" "$RUNNER_TEMP"/packed/llm-wiki-compiler-*.tgz
      - name: Tell the knowledge base
        env:
          GH_TOKEN: ${{ secrets.KB_DISPATCH_TOKEN }}
        run: gh workflow run pin-llmwiki.yml --repo Octember/knowledge-base --ref main
      - name: Prune all but the newest commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)
          gh api --paginate "repos/$GH_REPO/releases/$id/assets?per_page=100" --jq '.[] | [.created_at, .id, .name] | @tsv' \
            | sort -r \
            | awk -F'\t' -v keep="$KEEP" '{ sha = $3; sub(/.*-/, "", sha); if (!(sha in seen)) { seen[sha] = 1; n++ } if (n > keep) print $2 }' \
            | while read -r asset; do gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset"; done
